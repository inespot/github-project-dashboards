[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-project-dashboards"
version = "0.1.0"
description = "GitHub Projects dashboard with historical graphs, snapshots, and roadmap proposals"
requires-python = ">=3.11"
dependencies = [
    "solara>=1.40",
    "plotly>=5.22",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anywidget>=0.9",
    "polars>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
